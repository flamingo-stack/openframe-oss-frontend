name: Desktop Test

# =============================================================================
# WORKFLOW CONFIGURATION
# =============================================================================

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    # The shell is built against a placeholder bundle here, so web-only changes
    # cannot affect it.
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop-*.yml'
      - '.github/steps/rust-setup/**'
      - '.github/steps/setup-macos-signing/**'
      - '.github/steps/sign-windows-package/**'
      - '.github/steps/yaml-lint/**'
      - '.github/actionlint.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# =============================================================================
# JOBS
# =============================================================================

jobs:
  lint:
    name: "Desktop Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/steps/yaml-lint
        with:
          path: .github

      - uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color .github/workflows/desktop-release.yml .github/workflows/desktop-test.yml .github/workflows/desktop-version.yml

      - name: shellcheck
        run: shellcheck apps/desktop/scripts/*.sh

      - name: Parse-check tauri.conf.json
        run: |
          set -euo pipefail
          conf=apps/desktop/src-tauri/tauri.conf.json
          jq . "$conf" > /dev/null
          if jq -e '.bundle.createUpdaterArtifacts and (.plugins.updater.pubkey // "") == ""' "$conf" > /dev/null; then
            echo "::error file=$conf::createUpdaterArtifacts is on but plugins.updater.pubkey is empty"
            exit 1
          fi


  test_shell:
    name: "Desktop Test Shell: ${{ matrix.os }}"
    runs-on: "${{ matrix.os }}-latest"
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    env:
      CARGO_INCREMENTAL: 0
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            extra_targets: ''
          - os: windows
            extra_targets: aarch64-pc-windows-msvc

    steps:
      # Runs PR-authored build scripts; never hand them a persisted credential.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Rust tools
        uses: ./.github/steps/rust-setup
        with:
          path: apps/desktop/src-tauri
          toolchain: stable
          targets: ${{ matrix.extra_targets }}
          components: clippy, rustfmt
          shared-key: ${{ runner.os }}-${{ runner.arch }}

      - name: Run lint
        run: make lint

      - name: Run tests
        run: make test

      # ARM64 is cross-compiled and never executed: this is its only check.
      - name: Cross-compile check (${{ matrix.extra_targets }})
        if: matrix.extra_targets != ''
        run: |
          set -euo pipefail
          make web-placeholder
          cd src-tauri && cargo check --all-targets --target "${{ matrix.extra_targets }}"


  all-checks:
    name: "Desktop All Checks"
    needs: [lint, test_shell]
    permissions: {}
    runs-on: ubuntu-latest
    if: always()
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - run: echo "All checks passed"
