name: Scan main

# Scan Code in test.yml runs on pull requests only, so a CVE published after the last
# merge would first show up as a red check on somebody's unrelated PR. This runs the
# same scan against main on a schedule and opens one issue when it fails.
on:
  schedule:
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  issues: write

jobs:
  scan:
    name: "Scan Code (main)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Scan code
        uses: ./.github/steps/trivy
        with:
          scan: code

      - name: Open an issue if the scan failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Scan Code is failing on main"
        run: |
          set -euo pipefail
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq 'length')
          # One issue, not one per run: it stays open until someone fixes the finding and closes it.
          if [ "$open" -gt 0 ]; then exit 0; fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
            --body "Trivy found HIGH/CRITICAL vulnerabilities that have a fix. The report is in the \`scan_code\` artifact of $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
