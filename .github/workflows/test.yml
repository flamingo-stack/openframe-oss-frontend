name: Openframe Test

# =============================================================================
# WORKFLOW CONFIGURATION
# =============================================================================

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: 'ghcr.io'
  ORGANISATION: ${{ github.repository_owner }}
  REPOSITORY: ${{ github.event.repository.name }}

# =============================================================================
# JOBS
# =============================================================================

jobs:
  # Each app is checked only when its paths change; `every` applies to both
  # filters, so desktop is one brace pattern.
  changes:
    name: 'Changes'
    runs-on: ubuntu-latest
    if: github.event_name == 'merge_group' || (github.event.pull_request.state == 'open' && !github.event.pull_request.draft)
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      # Outside pull_request the filter diffs with git.
      - if: github.event_name == 'merge_group'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@v4.0.2
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            web:
              - '!apps/desktop/**'
              - '!apps/mobile/**'
            desktop:
              - '{apps/desktop,.github/steps/rust-setup}/**'

  # Repo-wide and cheap, so ungated.
  static:
    name: 'Static Checks'
    runs-on: ubuntu-latest
    needs: [changes]
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: ./.github/steps/yaml-lint
        with:
          path: .github

      - uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

      - name: shellcheck
        run: shellcheck apps/desktop/scripts/*.sh

      - name: Parse-check tauri.conf.json
        run: |
          set -euo pipefail
          conf=apps/desktop/src-tauri/tauri.conf.json
          jq . "$conf" > /dev/null
          if jq -e '.bundle.createUpdaterArtifacts and (.plugins.updater.pubkey // "") == ""' "$conf" > /dev/null; then
            echo "::error file=$conf::createUpdaterArtifacts is on but plugins.updater.pubkey is empty"
            exit 1
          fi
      # Squash commits take the PR title; read live so a re-run picks up an edited title or the no-task label.
      - name: Check PR title
        if: github.event.pull_request.user.type == 'User' && !startsWith(github.head_ref, 'renovate/')  # Renovate runs as a user
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr view "$PR" --json title,labels -q '.title + if any(.labels[]; .name == "no-task") then " CU-notask" else "" end' \
            | grep -qE "^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\(.+\))?!?: .+ CU-[0-9a-z]+$" \
            || { echo "::error::Expected 'fix(armor): exclude billing action CU-17tkuw5x3yh' (no-task label drops CU-); fix the title and re-run"; exit 1; }

  lint:
    name: 'Lint'
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      # No codegen step on purpose: the fast pass carries no type-aware rules, so
      # it reports the same findings with or without `src/__generated__` and
      # `src/generated` present (verified). Skipping relay-compiler and
      # generate-enums keeps this job a fraction of the image build's cost.
      - name: ESLint
        working-directory: apps/web
        run: npm run lint:ci

      # The loading standard (ported from the hub): no screen draws a skeleton, one
      # switch per component, no spinner or "Loading…" text, and a list skeleton
      # draws its full page. Headers of the two scripts state each rule.
      - name: Loading gates
        working-directory: apps/web
        run: npm run check:loading

  unit_test:
    name: 'Unit Test'
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      # Tests import the git-ignored enums and relay artifacts.
      - name: Generate code
        working-directory: apps/web
        run: npm run generate-enums && npx relay-compiler

      - name: Unit tests
        working-directory: apps/web
        run: npm test

      # Every page carries the stylesheet inside its HTML (next.config.mjs, the lib's withInlineStyles),
      # so its brotli size has a budget. The scan behind it reads the generated code above.
      - name: Stylesheet budget
        working-directory: apps/web
        run: npm run css:budget:check

  build_image:
    name: 'Test Frontend'
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    permissions:
      contents: read
      packages: write
      statuses: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORGANISATION }}/${{ env.REPOSITORY }}/${{ env.REPOSITORY }}
          tags: |
            type=raw,value=pr-${{ github.event.pull_request.number }}
            type=raw,value=pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}

      - name: Build image pr-${{ github.event.pull_request.number }}
        id: docker_build
        uses: nick-fields/retry@v4
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          max_attempts: 3
          retry_wait_seconds: 5
          timeout_minutes: 12
          shell: bash
          command: |
            args=(--platform linux/amd64,linux/arm64
                  --build-arg GITHUB_ACTOR=${{ github.actor }}
                  --build-arg OPENFRAME_BUNDLE_VERSION="pr-${PR_NUMBER}-${PR_SHA::7}"
                  -f "./apps/web/Dockerfile")
            while IFS= read -r t; do [ -n "$t" ] && args+=(--tag "$t"); done <<< "$META_TAGS"
            docker buildx build "${args[@]}" "./apps/web"

      # The image built above, amd64 from this job's builder cache, so no second build. A fixable
      # HIGH/CRITICAL finding fails the job: the image is not pushed and All Checks goes red. The
      # merge queue does not scan again.
      - name: Scan image
        if: github.event_name == 'pull_request'
        uses: ./.github/steps/trivy
        with:
          name: ${{ env.REPOSITORY }}
          dockerfile: ./apps/web/Dockerfile
          context: ./apps/web

      - name: Push image pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }} (pr-${{ github.event.pull_request.number }} tag)
        id: docker_push
        if: github.event_name == 'pull_request'
        uses: nick-fields/retry@v4
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          max_attempts: 3
          retry_wait_seconds: 5
          timeout_minutes: 12
          shell: bash
          command: |
            args=(--platform linux/amd64,linux/arm64
                  --build-arg GITHUB_ACTOR=${{ github.actor }}
                  --build-arg OPENFRAME_BUNDLE_VERSION="pr-${PR_NUMBER}-${PR_SHA::7}"
                  -f "./apps/web/Dockerfile")
            while IFS= read -r t; do [ -n "$t" ] && args+=(--tag "$t"); done <<< "$META_TAGS"
            docker buildx build "${args[@]}" --push --provenance=false --sbom=true "./apps/web"

  desktop_test:
    name: "Desktop Test: ${{ matrix.os }}"
    runs-on: "${{ matrix.os }}-latest"
    needs: [changes]
    if: needs.changes.outputs.desktop == 'true'
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: 0
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            extra_targets: ''
          - os: windows
            extra_targets: aarch64-pc-windows-msvc

    steps:
      # Runs PR-authored build scripts; never hand them a persisted credential.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Prepare Rust tools
        uses: ./.github/steps/rust-setup
        with:
          path: apps/desktop/src-tauri
          toolchain: stable
          targets: ${{ matrix.extra_targets }}
          components: clippy, rustfmt
          shared-key: ${{ runner.os }}-${{ runner.arch }}

      - name: Run lint
        run: make lint

      - name: Run tests
        run: make test

      # ARM64 is cross-compiled and never executed: this is its only check.
      - name: Cross-compile check (${{ matrix.extra_targets }})
        if: matrix.extra_targets != ''
        run: |
          set -euo pipefail
          make web-placeholder
          cd src-tauri && cargo check --all-targets --target "${{ matrix.extra_targets }}"

  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.state != 'open'
    permissions:
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Delete pr-${{ github.event.pull_request.number }} images
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          packages: ${{ env.REPOSITORY }}/${{ env.REPOSITORY }}
          delete-tags: pr-${{ github.event.pull_request.number }},pr-${{ github.event.pull_request.number }}-*
          delete-ghost-images: true

  all-checks:
    name: 'All Checks'
    needs: [changes, static, lint, unit_test, build_image, desktop_test]
    runs-on: ubuntu-latest
    # Skipped only with `changes` (draft or closed PR); an app's skipped jobs pass.
    if: always() && needs.changes.result != 'skipped'
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - run: echo "All checks passed"
