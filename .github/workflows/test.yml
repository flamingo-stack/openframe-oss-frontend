name: Openframe Test

# =============================================================================
# WORKFLOW CONFIGURATION
# =============================================================================

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: 'ghcr.io'
  ORGANISATION: ${{ github.repository_owner }}
  REPOSITORY: ${{ github.event.repository.name }}

# =============================================================================
# JOBS
# =============================================================================

jobs:
  # Each app is checked only when its paths change; `every` applies to all
  # filters, so desktop is one brace pattern, and so is shared_fixtures: each of
  # its files is read by a web unit test and a Rust one, so changing one from the
  # desktop side runs both.
  changes:
    name: 'Changes'
    runs-on: ubuntu-latest
    if: github.event_name == 'merge_group' || (github.event.pull_request.state == 'open' && !github.event.pull_request.draft)
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      desktop: ${{ steps.filter.outputs.desktop }}
      shared_fixtures: ${{ steps.filter.outputs.shared_fixtures }}
      mobile_ota: ${{ steps.filter.outputs.mobile_ota }}
    steps:
      # Outside pull_request the filter diffs with git.
      - if: github.event_name == 'merge_group'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@v4.0.2
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            web:
              - '!apps/desktop/**'
              - '!apps/mobile/**'
            desktop:
              - '{apps/desktop,.github/steps/rust-setup}/**'
            shared_fixtures:
              - 'apps/desktop/src-tauri/src/{install-command,notification-click}.json'
            mobile_ota:
              - '{apps/mobile/{ota,scripts}/**,apps/web/src/lib/native-shell.ts,.github/workflows/release.yml}'

  build_image:
    name: 'Test Frontend'
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    permissions:
      contents: read
      packages: write
      statuses: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORGANISATION }}/${{ env.REPOSITORY }}/${{ env.REPOSITORY }}
          tags: |
            type=raw,value=pr-${{ github.event.pull_request.number }}
            type=raw,value=pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}

      - name: Build image pr-${{ github.event.pull_request.number }}
        id: docker_build
        uses: nick-fields/retry@v4
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          max_attempts: 3
          retry_wait_seconds: 5
          timeout_minutes: 12
          shell: bash
          command: |
            args=(--platform linux/amd64,linux/arm64
                  --build-arg GITHUB_ACTOR=${{ github.actor }}
                  --build-arg OPENFRAME_BUNDLE_VERSION="pr-${PR_NUMBER}-${PR_SHA::7}"
                  -f "./apps/web/Dockerfile")
            while IFS= read -r t; do [ -n "$t" ] && args+=(--tag "$t"); done <<< "$META_TAGS"
            docker buildx build "${args[@]}" "./apps/web"

      # The image built above, amd64 from this job's builder cache, so no second build. A fixable
      # HIGH/CRITICAL finding fails the job: the image is not pushed and All Checks goes red. The
      # merge queue does not scan again.
      - name: Scan image
        if: github.event_name == 'pull_request'
        uses: ./.github/steps/trivy
        with:
          name: ${{ env.REPOSITORY }}
          dockerfile: ./apps/web/Dockerfile
          context: ./apps/web

      - name: Push image pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }} (pr-${{ github.event.pull_request.number }} tag)
        id: docker_push
        if: github.event_name == 'pull_request'
        uses: nick-fields/retry@v4
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          max_attempts: 3
          retry_wait_seconds: 5
          timeout_minutes: 12
          shell: bash
          command: |
            args=(--platform linux/amd64,linux/arm64
                  --build-arg GITHUB_ACTOR=${{ github.actor }}
                  --build-arg OPENFRAME_BUNDLE_VERSION="pr-${PR_NUMBER}-${PR_SHA::7}"
                  -f "./apps/web/Dockerfile")
            while IFS= read -r t; do [ -n "$t" ] && args+=(--tag "$t"); done <<< "$META_TAGS"
            docker buildx build "${args[@]}" --push --provenance=false --sbom=true "./apps/web"

  desktop_test:
    name: "Desktop Test: ${{ matrix.os }}"
    runs-on: "${{ matrix.os }}-latest"
    needs: [changes]
    if: needs.changes.outputs.desktop == 'true'
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: 0
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            extra_targets: ''
          - os: windows
            extra_targets: aarch64-pc-windows-msvc

    steps:
      # Runs PR-authored build scripts; never hand them a persisted credential.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Prepare Rust tools
        uses: ./.github/steps/rust-setup
        with:
          path: apps/desktop/src-tauri
          toolchain: stable
          targets: ${{ matrix.extra_targets }}
          components: clippy, rustfmt
          shared-key: ${{ runner.os }}-${{ runner.arch }}

      - name: Run lint
        run: make lint

      - name: Run tests
        run: make test

      # ARM64 is cross-compiled and never executed: this is its only check.
      - name: Cross-compile check (${{ matrix.extra_targets }})
        if: matrix.extra_targets != ''
        run: |
          set -euo pipefail
          make web-placeholder
          cd src-tauri && cargo check --all-targets --target "${{ matrix.extra_targets }}"

  # The release packs, signs and verifies the over-the-air bundle with these scripts
  # (apps/mobile/docs/ota.md); a broken script or keys.json would fail the release itself.
  mobile_ota_test:
    name: 'Mobile OTA Scripts'
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.mobile_ota == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Unit tests
        run: node --test apps/mobile/scripts/ota.test.mjs

      - name: Check apps/mobile/ota/keys.json
        run: node apps/mobile/scripts/ota-verify.mjs

  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.state != 'open'
    permissions:
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Delete pr-${{ github.event.pull_request.number }} images
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          packages: ${{ env.REPOSITORY }}/${{ env.REPOSITORY }}
          delete-tags: pr-${{ github.event.pull_request.number }},pr-${{ github.event.pull_request.number }}-*
          delete-ghost-images: true

  all-checks:
    name: 'All Checks'
    needs: [changes, static, lint, unit_test, build_image, desktop_test, mobile_ota_test]
    runs-on: ubuntu-latest
    # Skipped only with `changes` (draft or closed PR); an app's skipped jobs pass.
    if: always() && needs.changes.result != 'skipped'
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - run: echo "All checks passed"
